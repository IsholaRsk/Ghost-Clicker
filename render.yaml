services:
  - type: web
    name: ghost-clicker
    runtime: docker
    # Un service toujours actif est nécessaire pour la planification interne.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      # URL publique du projet Supabase Ghost Clicker.
      - key: SUPABASE_URL
        value: https://jecebpvujpthnblwixpb.supabase.co
      # À renseigner dans Render avec la clé serveur dédiée ; jamais dans Git.
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_TIMEOUT_SECONDS
        value: "10"
      - key: PROXY_GATEWAY_FILE
        value: /tmp/ghost-clicker-proxy-gateway.txt
      - key: HEADLESS
        value: "true"
      - key: NAVIGATION_TIMEOUT_MS
        value: "30000"
      - key: CLICK_TIMEOUT_MS
        value: "15000"
      - key: REDIRECT_TIMEOUT_MS
        value: "30000"
      - key: WAIT_AFTER_REDIRECT_SECONDS
        value: "2"
      - key: DELAY_BETWEEN_TARGETS_SECONDS
        value: "3"
      - key: SETTINGS_FILE
        value: /tmp/ghost-clicker-settings.json
      - key: REPORTS_FILE
        value: /tmp/ghost-clicker-reports.json
