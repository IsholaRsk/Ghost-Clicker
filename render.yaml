services:
  - type: web
    name: ghost-clicker
    runtime: docker
    # Un service toujours actif est nécessaire pour la planification interne.
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ADMIN_TOKEN
        generateValue: true
      - key: PROXY_LIST_JSON
        sync: false
      - key: ALLOWED_DOMAINS
        sync: false
      - key: HEADLESS
        value: "true"
      - key: IP_CHECK_URL
        value: https://ipinfo.io/json
      - key: NAVIGATION_TIMEOUT_MS
        value: "30000"
      - key: CLICK_TIMEOUT_MS
        value: "15000"
      - key: REDIRECT_TIMEOUT_MS
        value: "30000"
      - key: WAIT_AFTER_REDIRECT_SECONDS
        value: "2"
      - key: DELAY_BETWEEN_TARGETS_SECONDS
        value: "3"
      - key: SETTINGS_FILE
        value: /tmp/ghost-clicker-settings.json
      - key: REPORTS_FILE
        value: /tmp/ghost-clicker-reports.json
